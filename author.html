<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0e" />
  <title>Mwandishi — Stories Zone</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <style>
    :root {
      --bg: #0f0f0e;
      --bg-card: #141414;
      --bg-secondary: #1a1a1a;
      --text-primary: #e8e8e8;
      --text-secondary: #a8a8a8;
      --text-muted: #6e6e6e;
      --primary: #9c2518;
      --primary-hover: #b02d1f;
      --accent: #42a781;
      --border: #2a2a2a;
      --yellow: #fbbf24;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-full: 9999px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: calc(88px + var(--safe-bottom));
    }

    a { text-decoration: none; color: inherit; }

    header.top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 14, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .top-nav h1 { font-size: 18px; font-weight: 700; }

    .profile-hero {
      padding: 28px 16px 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(156,37,24,0.15) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }

    /* ===== AVATAR: object-fit cover — duara linajaa kabisa, hakuna gapes ===== */
    .author-avatar-large {
      width: 104px;
      height: 104px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 8px 24px rgba(156,37,24,0.3);
      position: relative;
    }

    .author-avatar-large-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #0a0a0a;
      border: 2px solid var(--bg);
      position: relative;
    }

    .author-avatar-main {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
      z-index: 2;
    }

    .author-initial-large {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), #c43a2a);
      color: #fff;
      font-size: 40px;
      font-weight: 700;
      position: relative;
      z-index: 2;
    }

    .author-name-large { font-size: 22px; font-weight: 700; margin-bottom: 6px; }

    .author-bio {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto 16px;
      line-height: 1.45;
    }

    .author-stats {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stat-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      text-align: center;
      min-width: 78px;
    }

    .stat-val { font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .stories-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 640px) {
      .stories-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }

    @media (min-width: 860px) {
      .stories-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }

    /* ===== STORY CARD: picha haikatwi + blur inajaza gapes ===== */
    .story-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .story-card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }

    .story-cover-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #0a0a0a;
    }

    .story-cover-blur {
      position: absolute;
      inset: -10px;
      width: calc(100% + 20px);
      height: calc(100% + 20px);
      object-fit: cover;
      filter: blur(18px) brightness(0.45) saturate(1.4);
      transform: scale(1.1);
      pointer-events: none;
      z-index: 1;
    }

    .story-cover-main {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      z-index: 2;
    }

    .story-cover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 70%, rgba(0, 0, 0, 0.4) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .story-type-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      backdrop-filter: blur(4px);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .story-type-badge.audio { background: rgba(66, 167, 129, 0.92); }
    .story-type-badge.story { background: rgba(156, 37, 24, 0.92); }

    .story-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .story-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .story-meta {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .story-meta span { display: inline-flex; align-items: center; gap: 4px; }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <button class="back-btn" onclick="history.back() || (window.location.href='index.html')" aria-label="Rudi">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1>Profaili ya Mwandishi</h1>
  </header>

  <main>
    <section class="profile-hero" id="authorHero">
      <div class="author-avatar-large">
        <div class="author-avatar-large-inner" id="heroAvatar">
          <div class="author-initial-large">...</div>
        </div>
      </div>
      <h2 class="author-name-large" id="heroName">Inapakia...</h2>
      <p class="author-bio" id="heroBio"></p>
      <div class="author-stats">
        <div class="stat-item">
          <div class="stat-val" id="statStories">0</div>
          <div class="stat-label">Hadithi</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="statAudio">0</div>
          <div class="stat-label">Sauti</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="statReads">0</div>
          <div class="stat-label">Wasomaji</div>
        </div>
      </div>
    </section>

    <div class="stories-container">
      <h3 class="section-title">
        <i class="fa-solid fa-book-open" style="color:var(--primary)"></i>
        Maudhui ya Mwandishi
      </h3>
      <div class="stories-grid" id="storiesGrid">
        <div class="empty-state">Inapakia...</div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://fuyzusikxmkjmnhpdbof.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1eXp1c2lreG1ram1uaHBkYm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjM3MTcsImV4cCI6MjA5NTEzOTcxN30.QaPxUs4e_O64nBxYhByGVkYa4tPIB9OCAh89xuQGG7c';
    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatNumber(num) {
      const n = Number(num) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }

    const params = new URLSearchParams(window.location.search);
    const authorParam = params.get('id') || params.get('author') || '';

    // ===================== LOAD AUTHOR PROFILE =====================
    async function loadAuthorProfile() {
      if (!authorParam) {
        document.getElementById('heroName').textContent = 'Mwandishi Hakupatikana';
        document.getElementById('storiesGrid').innerHTML =
          '<div class="empty-state">Mwandishi hajatambuliwa. Tafadhali rudi mwanzo.</div>';
        return;
      }

      let authorData = { name: authorParam, avatar_url: null, bio: '' };
      let resolvedAuthorName = authorParam;
      let resolvedAuthorId = null;

      try {
        const url = `${SUPABASE_URL}/rest/v1/authors?id=eq.${encodeURIComponent(authorParam)}&select=id,name,avatar_url,bio&limit=1`;
        const res = await fetch(url, { headers });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            authorData = data[0];
            resolvedAuthorName = data[0].name || authorParam;
            resolvedAuthorId = data[0].id || null;
          }
        }
      } catch (err) { console.warn('authors id lookup failed:', err); }

      if (!resolvedAuthorId) {
        try {
          const byNameUrl = `${SUPABASE_URL}/rest/v1/authors?name=ilike.${encodeURIComponent(authorParam.trim())}&select=id,name,avatar_url,bio&limit=1`;
          const byNameRes = await fetch(byNameUrl, { headers });
          if (byNameRes.ok) {
            const d2 = await byNameRes.json();
            if (Array.isArray(d2) && d2.length > 0) {
              authorData = d2[0];
              resolvedAuthorName = d2[0].name || authorParam;
              resolvedAuthorId = d2[0].id || null;
            }
          }
        } catch (err) { console.warn('authors name lookup failed:', err); }
      }

      const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      if (!resolvedAuthorId && UUID_RE.test(authorParam)) resolvedAuthorId = authorParam;

      const name = authorData.name || resolvedAuthorName;
      document.title = `${name} — Stories Zone`;
      document.getElementById('heroName').textContent = name;
      if (authorData.bio) document.getElementById('heroBio').textContent = authorData.bio;

      const initial = (name.trim().charAt(0) || 'M').toUpperCase();
      const heroAvatarEl = document.getElementById('heroAvatar');
      if (authorData.avatar_url) {
        heroAvatarEl.innerHTML = `
          <img class="author-avatar-main" src="${escapeHtml(authorData.avatar_url)}" alt="${escapeHtml(name)}"
               onerror="this.parentElement.innerHTML='<div class=\\'author-initial-large\\'>${initial}</div>'" />
        `;
      } else {
        heroAvatarEl.innerHTML = `<div class="author-initial-large">${initial}</div>`;
      }

      loadAuthorStories(resolvedAuthorName, authorParam, resolvedAuthorId);
    }

    // ===================== LOAD AUTHOR STORIES + AUDIO =====================
    async function loadAuthorStories(authorName, originalParam, authorId) {
      const grid = document.getElementById('storiesGrid');
      try {
        let stories = [];
        let audios = [];

        const publishedFilter = 'status=in.(Inaendelea,Imekamilika)';

        if (authorId) {
          const url0 = `${SUPABASE_URL}/rest/v1/stories?author_user_id=eq.${encodeURIComponent(authorId)}&${publishedFilter}&order=created_at.desc`;
          const res0 = await fetch(url0, { headers });
          if (res0.ok) { const d0 = await res0.json(); stories = Array.isArray(d0) ? d0 : []; }
        }
        if (!stories.length) {
          const url1 = `${SUPABASE_URL}/rest/v1/stories?author=eq.${encodeURIComponent(authorName)}&${publishedFilter}&order=created_at.desc`;
          const res1 = await fetch(url1, { headers });
          if (res1.ok) { const d1 = await res1.json(); stories = Array.isArray(d1) ? d1 : []; }
        }
        if (!stories.length) {
          const url2 = `${SUPABASE_URL}/rest/v1/stories?author=ilike.${encodeURIComponent(authorName.trim())}&${publishedFilter}&order=created_at.desc`;
          const res2 = await fetch(url2, { headers });
          if (res2.ok) { const d2 = await res2.json(); stories = Array.isArray(d2) ? d2 : []; }
        }
        if (!stories.length && originalParam !== authorName) {
          const url3 = `${SUPABASE_URL}/rest/v1/stories?author=ilike.${encodeURIComponent(originalParam.trim())}&${publishedFilter}&order=created_at.desc`;
          const res3 = await fetch(url3, { headers });
          if (res3.ok) { const d3 = await res3.json(); stories = Array.isArray(d3) ? d3 : []; }
        }
        if (!stories.length) {
          if (authorId) {
            const url4a = `${SUPABASE_URL}/rest/v1/stories?author_user_id=eq.${encodeURIComponent(authorId)}&order=created_at.desc`;
            const res4a = await fetch(url4a, { headers });
            if (res4a.ok) { const d4a = await res4a.json(); stories = Array.isArray(d4a) ? d4a : []; }
          }
          if (!stories.length) {
            const url4b = `${SUPABASE_URL}/rest/v1/stories?author=ilike.${encodeURIComponent(authorName.trim())}&order=created_at.desc`;
            const res4b = await fetch(url4b, { headers });
            if (res4b.ok) { const d4b = await res4b.json(); stories = Array.isArray(d4b) ? d4b : []; }
          }
        }

        if (authorId) {
          const audioUrl = `${SUPABASE_URL}/rest/v1/audio_items?author_user_id=eq.${encodeURIComponent(authorId)}&is_published=eq.true&order=created_at.desc`;
          const audioRes = await fetch(audioUrl, { headers });
          if (audioRes.ok) {
            const dAudio = await audioRes.json();
            audios = Array.isArray(dAudio) ? dAudio : [];
          }
        }

        if (!Array.isArray(stories)) stories = [];
        if (!Array.isArray(audios)) audios = [];

        stories.forEach(s => s._type = 'story');
        audios.forEach(a => a._type = 'audio');

        const combined = [...stories, ...audios].sort((a, b) => {
          const da = new Date(a.created_at || 0).getTime();
          const db = new Date(b.created_at || 0).getTime();
          return db - da;
        });

        document.getElementById('statStories').textContent = stories.length;
        document.getElementById('statAudio').textContent = audios.length;
        const totalReads = stories.reduce((acc, s) => acc + (Number(s.total_reads) || 0), 0)
                        + audios.reduce((acc, a) => acc + (Number(a.total_plays) || 0), 0);
        document.getElementById('statReads').textContent = formatNumber(totalReads);

        if (combined.length === 0) {
          grid.innerHTML = '<div class="empty-state">Mwandishi huyu hana maudhui yaliyochapishwa kwa sasa.</div>';
          return;
        }

        const FALLBACK = 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=400&q=80';

        grid.innerHTML = combined.map(item => {
          if (item._type === 'audio') {
            const cover = item.cover_image_url || FALLBACK;
            const title = escapeHtml(item.title || 'Simulizi ya Sauti');
            const plays = formatNumber(item.total_plays || 0);
            const link = item.slug
              ? `audio/${encodeURIComponent(item.slug)}`
              : `simulizi_audio.html?story=${encodeURIComponent(item.id)}`;
            return `
              <a href="${link}" class="story-card">
                <div class="story-cover-wrap">
                  <img class="story-cover-blur" src="${escapeHtml(cover)}" alt="" aria-hidden="true" />
                  <img class="story-cover-main" src="${escapeHtml(cover)}" alt="${title}" loading="lazy" onerror="this.src='${FALLBACK}'" />
                  <div class="story-cover-overlay"></div>
                  <span class="story-type-badge audio"><i class="fa-solid fa-headphones"></i> Sauti</span>
                </div>
                <div class="story-info">
                  <h4 class="story-title">${title}</h4>
                  <div class="story-meta">
                    <span><i class="fa-solid fa-headphones"></i> ${plays}</span>
                    <span><i class="fa-solid fa-chevron-right"></i></span>
                  </div>
                </div>
              </a>
            `;
          }
          const cover = item.cover_image_url || FALLBACK;
          const title = escapeHtml(item.title || 'Hadithi');
          const reads = formatNumber(item.total_reads || 0);
          return `
            <a href="story.html?id=${encodeURIComponent(item.id)}" class="story-card">
              <div class="story-cover-wrap">
                <img class="story-cover-blur" src="${escapeHtml(cover)}" alt="" aria-hidden="true" />
                <img class="story-cover-main" src="${escapeHtml(cover)}" alt="${title}" loading="lazy" onerror="this.src='${FALLBACK}'" />
                <div class="story-cover-overlay"></div>
                <span class="story-type-badge story"><i class="fa-solid fa-book"></i> Hadithi</span>
              </div>
              <div class="story-info">
                <h4 class="story-title">${title}</h4>
                <div class="story-meta">
                  <span><i class="fa-regular fa-eye"></i> ${reads}</span>
                  <span><i class="fa-solid fa-chevron-right"></i></span>
                </div>
              </div>
            </a>
          `;
        }).join('');
      } catch (err) {
        console.error('Error loading author stories:', err);
        grid.innerHTML = '<div class="empty-state">Imeshindikana kupakia maudhui ya mwandishi huyu.</div>';
      }
    }

    loadAuthorProfile();
  </script>
</body>
</html>
