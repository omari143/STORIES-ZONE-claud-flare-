<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0e" />
  <title>Stories Zone — Soma Hadithi za Kusisimua</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <style>
    :root {
      --bg: #0f0f0e;
      --bg-card: #141414;
      --bg-secondary: #1a1a1a;
      --text-primary: #e8e8e8;
      --text-secondary: #a8a8a8;
      --text-muted: #6e6e6e;
      --primary: #9c2518;
      --primary-hover: #b02d1f;
      --accent: #42a781;
      --accent-hover: #4dbd94;
      --border: #2a2a2a;
      --yellow: #fbbf24;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-full: 9999px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;

      --shadow-sm: 0 2px 6px rgba(0,0,0,.25);
      --shadow-md: 0 8px 20px rgba(0,0,0,.35);
      --shadow-lg: 0 14px 36px rgba(0,0,0,.45);

      --ease: cubic-bezier(.22,.61,.36,1);
      --dur-fast: .18s;
      --dur: .25s;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      padding-bottom: calc(88px + var(--safe-bottom));
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      -webkit-tap-highlight-color: transparent;
    }

    img {
      max-width: 100%;
      display: block;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-secondary);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--bg-card);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 14, 0.85);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid transparent;
      transition:
        border-color var(--dur) var(--ease),
        background var(--dur) var(--ease);
      padding-top: var(--safe-top);
    }

    .header.scrolled {
      background: rgba(15, 15, 14, 0.95);
      border-bottom-color: var(--border);
    }

    .header-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px var(--space-4);
      gap: var(--space-3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .logo-img {
      height: 38px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      color: white;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .notification-nav {
      position: absolute;
      top: 12px;
      right: 74px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      border-radius: 50%;
      flex-shrink: 0;
      transition:
        color var(--dur-fast) var(--ease),
        background var(--dur-fast) var(--ease),
        transform var(--dur-fast) var(--ease);
    }

    .notification-nav.logged-in {
      right: 16px;
    }

    .notification-nav:hover {
      color: white;
      background: var(--bg-secondary);
    }

    .notification-nav:active {
      transform: scale(.92);
    }

    .notification-nav i {
      font-size: 20px;
    }

    .notification-dot {
      position: absolute;
      top: 2px;
      right: 0px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      background: var(--primary);
      border: 2px solid var(--bg);
      border-radius: 999px;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .notification-dot.show {
      display: flex;
    }

    .hero {
      position: relative;
      height: clamp(380px, 60vh, 460px);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero {
        height: clamp(440px, 65vh, 540px);
      }
    }

    .hero-slides {
      position: absolute;
      inset: 0;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity .8s var(--ease);
    }

    .hero-slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    .hero-slide .hero-bg,
    .hero-slide .hero-overlay,
    .hero-slide .hero-gradient,
    .hero-slide .hero-content {
      position: absolute;
      inset: 0;
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 8s var(--ease);
    }

    .hero:hover .hero-bg img {
      transform: scale(1.06);
    }

    .hero-overlay {
      background: linear-gradient(
        to right,
        rgba(15,15,14,.92),
        rgba(15,15,14,.55),
        rgba(15,15,14,.1)
      );
    }

    .hero-gradient {
      background: linear-gradient(
        to top,
        var(--bg) 0%,
        transparent 55%
      );
    }

    .hero-content {
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: var(--space-5) var(--space-4) calc(var(--space-10) + 40px);
      animation: heroFade .6s var(--ease) both;
    }

    @keyframes heroFade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 768px) {
      .hero-content {
        padding: var(--space-8) var(--space-8) calc(var(--space-10) + 56px);
      }
    }

    .hero-badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .badge {
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .badge-genre {
      background: var(--accent);
      color: white;
    }

    .badge-chapters {
      background: var(--primary);
      color: white;
    }

    .hero-title {
      font-size: clamp(26px, 6vw, 32px);
      font-weight: 700;
      color: white;
      margin-bottom: var(--space-3);
      max-width: 560px;
      line-height: 1.15;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .hero-title {
        font-size: clamp(36px, 5vw, 48px);
        letter-spacing: -1px;
      }
    }

    .hero-description {
      font-size: 14px;
      color: #c4c4c4;
      max-width: 480px;
      margin-bottom: var(--space-5);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero-description {
        font-size: 16px;
        -webkit-line-clamp: 3;
      }
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-3);
    }

    .hero-dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 90px;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 5;
    }

    .hero-dots button {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      transition:
        width var(--dur) var(--ease),
        background var(--dur) var(--ease);
    }

    .hero-dots button.active {
      width: 22px;
      border-radius: 999px;
      background: var(--primary);
    }

    .hero-thumbs {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      display: flex;
      gap: 8px;
      padding: 0 var(--space-4);
      overflow-x: auto;
      z-index: 5;
      scroll-snap-type: x mandatory;
    }

    .hero-thumb {
      flex: 0 0 auto;
      width: 56px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      opacity: .6;
      cursor: pointer;
      transition:
        opacity var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        transform var(--dur-fast) var(--ease);
      scroll-snap-align: start;
      background: var(--bg-card);
    }

    .hero-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-thumb.active {
      opacity: 1;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-full);
      transition:
        background var(--dur-fast) var(--ease),
        transform var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease);
      will-change: transform;
      letter-spacing: .2px;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(156,37,24,.35);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 18px rgba(156,37,24,.45);
    }

    .btn-secondary {
      background: rgba(255,255,255,.08);
      color: white;
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,.14);
    }

    .btn-accent {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 14px rgba(66,167,129,.3);
    }

    .btn-accent:hover {
      background: var(--accent-hover);
    }

    .search-section {
      padding: var(--space-5) var(--space-4) var(--space-3);
    }

    .search-bar {
      position: relative;
      margin-bottom: var(--space-4);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-bar input {
      width: 100%;
      padding: 13px 16px 13px 46px;
      background: var(--bg-secondary);
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition:
        background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease);
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    .search-bar input:focus {
      background: var(--bg-card);
      border-color: rgba(156,37,24,.4);
      box-shadow: 0 0 0 4px rgba(156,37,24,.12);
    }

    .filter-tabs {
      display: flex;
      gap: var(--space-2);
      padding-bottom: 4px;
    }

    .filter-tab {
      flex-shrink: 0;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      transition:
        background var(--dur-fast) var(--ease),
        color var(--dur-fast) var(--ease),
        transform var(--dur-fast) var(--ease);
      white-space: nowrap;
    }

    .filter-tab:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .filter-tab:active {
      transform: scale(.96);
    }

    .filter-tab.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(66,167,129,.3);
    }

    .section {
      padding: var(--space-5) 0 var(--space-3);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-4);
      margin-bottom: var(--space-4);
      gap: var(--space-3);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    @media (min-width: 768px) {
      .section-title {
        font-size: 20px;
      }
    }

    .section-title-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .view-all {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
      transition:
        color var(--dur-fast) var(--ease),
        transform var(--dur-fast) var(--ease);
      white-space: nowrap;
    }

    .view-all:hover {
      color: var(--primary-hover);
      transform: translateX(2px);
    }

    .stories-scroll {
      display: flex;
      gap: var(--space-4);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px var(--space-4) var(--space-4);
      scroll-snap-type: x mandatory;
      scroll-padding-left: var(--space-4);
      -webkit-overflow-scrolling: touch;
    }

    .stories-scroll::-webkit-scrollbar {
      display: none;
    }

    .story-card {
      flex-shrink: 0;
      width: 142px;
      cursor: pointer;
      scroll-snap-align: start;
      transition: transform var(--dur) var(--ease);
      animation: cardIn .35s var(--ease) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 768px) {
      .story-card {
        width: 168px;
      }
    }

    .story-card:hover {
      transform: translateY(-4px);
    }

    .story-card:active {
      transform: translateY(-2px) scale(.98);
    }

    .story-card-cover {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 10px;
      background: var(--bg-secondary);
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--dur) var(--ease);
    }

    .story-card:hover .story-card-cover {
      box-shadow: var(--shadow-md);
    }

    @media (min-width: 768px) {
      .story-card-cover {
        height: 232px;
      }
    }

    .story-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s var(--ease);
    }

    .story-card:hover .story-card-cover img {
      transform: scale(1.06);
    }

    .story-card-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }

    .story-badge {
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      letter-spacing: .3px;
    }

    .story-badge.updated {
      background: var(--primary);
      color: white;
    }

    .story-badge.new {
      background: var(--accent);
      color: white;
    }

    .story-card-status {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 2;
    }

    .status-badge {
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      background: rgba(0,0,0,.7);
      color: white;
      backdrop-filter: blur(4px);
    }

    .status-badge.ongoing {
      background: rgba(66,167,129,.85);
    }

    .share-fab {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12);
      transition:
        background var(--dur-fast) var(--ease),
        transform var(--dur-fast) var(--ease);
    }

    .share-fab:hover {
      background: var(--primary);
    }

    .share-fab:active {
      transform: scale(.92);
    }

    .share-fab svg {
      width: 16px;
      height: 16px;
    }

    .trending-card {
      position: relative;
    }

    .trending-card .share-fab {
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
    }

    .trending-card .share-fab:active {
      transform: translateY(-50%) scale(.92);
    }

    .share-toast {
      position: fixed;
      left: 50%;
      bottom: calc(110px + var(--safe-bottom));
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity var(--dur) var(--ease),
        transform var(--dur) var(--ease);
      z-index: 1000;
    }

    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .story-card-info h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      letter-spacing: -.1px;
    }

    .story-card-genre {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .story-card-stats {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: 12px;
      color: var(--text-muted);
    }

    .story-card-stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .star-icon {
      color: var(--yellow);
    }

    .trending-scroll {
      display: flex;
      gap: var(--space-3);
      overflow-x: auto;
      padding: 4px var(--space-4) var(--space-4);
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }

    .trending-scroll::-webkit-scrollbar {
      display: none;
    }

    .trending-card {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-shrink: 0;
      min-width: 290px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: var(--space-3);
      cursor: pointer;
      scroll-snap-align: start;
      transition:
        background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        transform var(--dur-fast) var(--ease);
    }

    .trending-card:hover {
      background: var(--bg-secondary);
      border-color: var(--border);
      transform: translateY(-2px);
    }

    .trending-card:active {
      transform: translateY(0) scale(.99);
    }

    .trending-rank {
      font-size: 34px;
      font-weight: 700;
      color: rgba(156,37,24,.75);
      width: 30px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
    }

    .trending-cover {
      width: 58px;

<script>
const SUPABASE_URL =
  'https://fuyzusikxmkjmnhpdbof.supabase.co';

const SUPABASE_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1eXp1c2lreG1ram1uaHBkYm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjM3MTcsImV4cCI6MjA5NTEzOTcxN30.QaPxUs4e_O64nBxYhByGVkYa4tPIB9OCAh89xuQGG7c';

const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

let heroStory = null;

function updateNotificationDot(count = 0) {
  const dot = document.getElementById('notificationDot');
  if (!dot) return;

  const numericCount = Number(count) || 0;

  if (numericCount > 0) {
    dot.textContent =
      numericCount > 99 ? '99+' : String(numericCount);
    dot.classList.add('show');
  } else {
    dot.textContent = '0';
    dot.classList.remove('show');
  }
}

updateNotificationDot(0);

window.addEventListener('storage', function(event) {
  if (event.key === 'storieszone_new_message') {
    updateNotificationDot(
      event.newValue === 'true' ? 1 : 0
    );
  }
});

function goToStory(storyId) {
  if (!storyId) return;

  window.location.href =
    `story.html?id=${encodeURIComponent(storyId)}`;
}

function getStoryUrl(storyId) {
  return `https://storieszone.site/story.html?id=${encodeURIComponent(storyId)}`;
}

function showShareToast(msg) {
  let t = document.getElementById('shareToast');

  if (!t) {
    t = document.createElement('div');
    t.id = 'shareToast';
    t.className = 'share-toast';
    document.body.appendChild(t);
  }

  t.textContent = msg;
  t.classList.add('show');

  clearTimeout(t._hideTimer);

  t._hideTimer =
    setTimeout(
      () => t.classList.remove('show'),
      2200
    );
}

async function shareStory(storyId, title, event) {
  if (event) {
    event.stopPropagation();
    event.preventDefault();
  }

  const url = getStoryUrl(storyId);

  const shareText =
    `Soma hadithi "${title}" kwenye Stories Zone`;

  try {
    if (navigator.share) {
      await navigator.share({
        title: title || 'Stories Zone',
        text: shareText,
        url: url
      });

      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') {
      return;
    }
  }

  try {
    await navigator.clipboard.writeText(url);

    showShareToast('Link imenakiliwa!');

  } catch {
    showShareToast(
      'Imeshindikana kunakili link.'
    );
  }
}

function openHeroStory() {
  if (heroStory) {
    goToStory(heroStory.id);
  }
}

async function fetchStories(params = '') {
  const url =
    `${SUPABASE_URL}/rest/v1/stories?is_published=eq.true&${params}`;

  const res =
    await fetch(
      url,
      { headers }
    );

  if (!res.ok) {
    throw new Error('Fetch failed');
  }

  return res.json();
}

async function fetchGenres() {
  const url =
    `${SUPABASE_URL}/rest/v1/genres?select=id,name`;

  const res =
    await fetch(
      url,
      { headers }
    );

  if (!res.ok) {
    return [];
  }

  return res.json();
}

function buildStoryCard(story, genreMap) {
  const genreName =
    genreMap[story.genre_id] || '';

  const isNew =
    isRecentStory(story.published_at);

  const badgeHtml =
    isNew
      ? `<span class="story-badge new">Mpya</span>`
      : `<span class="story-badge updated">Imesasishwa</span>`;

  const statusClass =
    story.status === 'Inaendelea'
      ? 'ongoing'
      : '';

  const statusLabel =
    story.status || 'Inaendelea';

  const rating =
    story.total_rating
      ? Number(story.total_rating).toFixed(1)
      : '—';

  const reads =
    formatReads(story.total_reads || 0);

  const cover =
    story.cover_image_url ||
    'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=300&q=80';

  const safeTitle =
    escapeHtml(story.title || '');

  const titleAttr =
    escapeJsString(story.title || '');

  return `
    <div
      class="story-card"
      onclick="goToStory('${story.id}')"
    >

      <div class="story-card-cover">

        <img
          src="${cover}"
          alt="${safeTitle}"
          loading="lazy"
          onerror="this.src='https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=300&q=80'"
        />

        <div class="story-card-badges">
          ${badgeHtml}
        </div>

        <button
          class="share-fab"
          title="Shiriki hadithi"
          aria-label="Shiriki hadithi"
          onclick="shareStory('${story.id}', '${titleAttr}', event)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>

        <div class="story-card-status">
          <span class="status-badge ${statusClass}">
            ${escapeHtml(statusLabel)}
          </span>
        </div>

      </div>

      <div class="story-card-info">

        <h3>
          ${safeTitle}
        </h3>

        <div class="story-card-genre">
          ${escapeHtml(genreName)}
        </div>

        <div class="story-card-stats">

          <span>
            <span class="star-icon">★</span>
            ${rating}
          </span>

          <span>
            👁 ${reads}
          </span>

        </div>

      </div>

    </div>
  `;
}

function buildTrendingCard(story, rank, genreMap) {
  const genreName =
    genreMap[story.genre_id] || '';

  const cover =
    story.cover_image_url ||
    'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=100&q=80';

  const reads =
    formatReads(story.total_reads || 0);

  const safeTitle =
    escapeHtml(story.title || '');

  const titleAttr =
    escapeJsString(story.title || '');

  return `
    <div
      class="trending-card"
      onclick="goToStory('${story.id}')"
    >

      <div class="trending-rank">
        ${rank}
      </div>

      <div class="trending-cover">

        <img
          src="${cover}"
          alt="${safeTitle}"
          loading="lazy"
          onerror="this.src='https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=100&q=80'"
        />

      </div>

      <div class="trending-info">

        <h3>
          ${safeTitle}
        </h3>

        <div class="genre">
          ${escapeHtml(genreName)}
        </div>

        <div class="views">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            style="width:12px;height:12px;"
          >
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>

          ${reads} wasomaji

        </div>

      </div>

      <button
        class="share-fab"
        title="Shiriki hadithi"
        aria-label="Shiriki hadithi"
        onclick="shareStory('${story.id}', '${titleAttr}', event)"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>

      </button>

    </div>
  `;
}

function escapeHtml(str) {
  if (!str) return '';

  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeJsString(str) {
  return String(str || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n');
}

function formatReads(n) {
  if (n >= 1000000) {
    return (n / 1000000).toFixed(1) + 'M';
  }

  if (n >= 1000) {
    return (n / 1000).toFixed(1) + 'k';
  }

  return String(n);
}

function isRecentStory(publishedAt) {
  if (!publishedAt) {
    return false;
  }

  const days =
    (
      Date.now() -
      new Date(publishedAt).getTime()
    ) /
    (
      1000 * 60 * 60 * 24
    );

  return days <= 30;
}

  dotsEl.innerHTML =

function showHeroSlide(idx, manual) {
  if (!heroSlideStories.length) {
    return;
  }

  heroSlideIndex =
    (
      idx +
      heroSlideStories.length
    ) %
    heroSlideStories.length;

  heroStory =
    heroSlideStories[
      heroSlideIndex
    ];

  document
    .querySelectorAll('#heroSlides .hero-slide')
    .forEach(
      (el, i) =>
        el.classList.toggle(
          'active',
          i === heroSlideIndex
        )
    );

  document
    .querySelectorAll('#heroDots button')
    .forEach(
      (el, i) =>
        el.classList.toggle(
          'active',
          i === heroSlideIndex
        )
    );

  document
    .querySelectorAll('#heroThumbs .hero-thumb')
    .forEach(
      (el, i) =>
        el.classList.toggle(
          'active',
          i === heroSlideIndex
        )
    );

  if (manual) {
    startHeroAutoplay();
  }
}

function startHeroAutoplay() {
  if (heroSlideTimer) {
    clearInterval(heroSlideTimer);
  }

  if (heroSlideStories.length < 2) {
    return;
  }

  heroSlideTimer =
    setInterval(
      () =>
        showHeroSlide(
          heroSlideIndex + 1
        ),
      5000
    );
}

async function doSearch(query) {

  if (!query) {

    loadAllData();

    return;

  }

  try {

    const encoded =
      encodeURIComponent(query);

    const url =
      `${SUPABASE_URL}/rest/v1/stories?is_published=eq.true&or=(title.ilike.*${encoded}*,author.ilike.*${encoded}*)&order=total_reads.desc&limit=20`;

    const res =
      await fetch(
        url,
        { headers }
      );

    const results =
      await res.json();

    const genres =
      await fetchGenres();

    const genreMap = {};

    genres.forEach(g => {
      genreMap[g.id] =
        g.name || '';
    });

    const container =
      document.getElementById(
        'popularStoriesContainer'
      );

    if (results.length > 0) {

      container.innerHTML =

          .map(

              buildStoryCard(

              )

          .join('');

    } else {

      container.innerHTML =
        `<p style="color:var(--text-muted);padding:16px;">Hakuna matokeo kwa "${escapeHtml(query)}".</p>`;

    }

    document.getElementById(
      'trendingContainer'
    ).innerHTML = '';

    document.getElementById(
      'newStoriesContainer'
    ).innerHTML = '';

  } catch (e) {

    console.error(e);

  }
}

<script type="module">

import {
  createClient
} from

const SUPABASE_URL =
  'https://fuyzusikxmkjmnhpdbof.supabase.co';

const SUPABASE_ANON_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmdXl6dXNpa3hta2ptbmhocGRib2YiLCJpYXQiOjE3Nzk1NjM3MTcsImV4cCI6MjA5NTEzOTcxN30.QaPxUs4e_O64nBxYhByGVkYa4tPIB9OCAh89xuQGG7c';

const supabaseAuth =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

async function checkNotificationCount(user) {

  if (!user || !user.id) {

    updateNotificationDot(0);

    return;

  }

  try {

    const sessionResult =
      await supabaseAuth.auth.getSession();

    const session =
      sessionResult?.data?.session;

    const accessToken =
      session?.access_token ||
      SUPABASE_ANON_KEY;

    const authHeaders = {

      'apikey':
        SUPABASE_ANON_KEY,

      'Authorization':
        `Bearer ${accessToken}`,

      'Content-Type':
        'application/json',

      'Accept':
        'application/json'

    };

    const messagesUrl =
      `${SUPABASE_URL}/rest/v1/messages?select=id&user_id=eq.${encodeURIComponent(user.id)}&is_read=eq.false`;

    const messagesResponse =
      await fetch(
        messagesUrl,
        {
          headers: {
            ...authHeaders,
            'Prefer': 'count=exact'
          }
        }
      );

    let unreadMessages = 0;

    if (messagesResponse.ok) {

      const contentRange =
        messagesResponse.headers.get(
          'content-range'
        );

      if (contentRange) {

        const match =
          contentRange.match(
            /\/(\d+)$/
          );

        if (match) {

          unreadMessages =
            Number(
              match[1]
            ) || 0;

        }

      }

      if (!contentRange) {

        const messageRows =
          await messagesResponse.json();

        unreadMessages =
          Array.isArray(messageRows)
            ? messageRows.length
            : 0;

      }

    }

    const supportUrl =
      `${SUPABASE_URL}/rest/v1/supports?select=id,admin_response,updated_at,created_at&user_id=eq.${encodeURIComponent(user.id)}&admin_response=not.is.null&order=updated_at.desc`;

    const supportResponse =
      await fetch(
        supportUrl,
        {
          headers:
            authHeaders
        }
      );

    let newSupportReplies = 0;

    if (supportResponse.ok) {

      const supports =
        await supportResponse.json();

      let seenSupportReplies = [];

      try {

        seenSupportReplies =
          JSON.parse(
            localStorage.getItem(
              'storieszone_seen_support_replies'
            ) || '[]'
          );

        if (
          !Array.isArray(
            seenSupportReplies
          )
        ) {
          seenSupportReplies = [];
        }

      } catch {

        seenSupportReplies = [];

      }

      const seenSet =
        new Set(
          seenSupportReplies.map(
            id => String(id)
          )
        );

      supports.forEach(
        support => {

          if (
            support &&
            support.admin_response &&
            !seenSet.has(
              String(
                support.id
              )
            )
          ) {

            newSupportReplies++;

          }

        }
      );

    }

    const totalUnread =
      unreadMessages +
      newSupportReplies;

    updateNotificationDot(
      totalUnread
    );

    localStorage.setItem(
      'storieszone_new_message',
      totalUnread > 0
        ? 'true'
        : 'false'
    );

  } catch (error) {

    console.error(
      'Notification check error:',
      error
    );

  }

}

    const {
      data: {
        user
      }
    } =

    const authBtn =

      if (navLink) {

          'profile.html';
      }

      await checkNotificationCount(

      );

    } else {

      if (authBtn) {

        authBtn.style.display =
          'inline-flex';

        authBtn.textContent =
          'Ingia';

        authBtn.href =
          'https://storieszone.site/login.html';

        authBtn.style.background =
          '';

        authBtn.style.color =
          '';

      }

      if (notificationNav) {

        notificationNav.classList.remove(
          'logged-in'
        );

      }

      if (navLabel) {

        navLabel.textContent =
          'Akaunti';

      }

      if (navLink) {

        navLink.href =
          'https://storieszone.site/login.html';

      }

      updateNotificationDot(0);

    }

  } catch (err) {

    console.error(
      'Session check error:',
      err
    );

  }

}

let notificationInterval =
  null;

async function startNotificationChecker() {

  if (notificationInterval) {

    clearInterval(
      notificationInterval
    );

  }

  notificationInterval =
    setInterval(
      async () => {

        try {

          const {
            data: {
              user
            }
          } =
            await supabaseAuth
              .auth
              .getUser();

          if (user) {

            await checkNotificationCount(
              user
            );

          }

        } catch (error) {

          console.error(
            'Notification refresh error:',
            error
          );

        }

      },
      20000
    );

}

if (
  document.readyState ===
  'loading'
) {

  document.addEventListener(
    'DOMContentLoaded',
    async () => {

      await checkUserSession();
      startNotificationChecker();

    }
  );

} else {

  await checkUserSession();
  startNotificationChecker();

}

supabaseAuth.auth.onAuthStateChange(
  async () => {

    await checkUserSession();

  }
);
