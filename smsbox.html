<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Sanduku la Jumbe — STORIES ZONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0e;
      --bg-card: #141414;
      --bg-secondary: #1a1a1a;
      --text-primary: #e8e8e8;
      --text-secondary: #888888;
      --text-muted: #666666;
      --primary: #9c2518;
      --primary-hover: #b02d1f;
      --accent: #42a781;
      --accent-hover: #4dbd94;
      --border: #2a2a2a;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-full: 9999px;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      padding-bottom: 80px;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,15,14,0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .logo-text { 
      font-size: 20px; 
      font-weight: 700; 
      letter-spacing: -0.5px; 
      color: var(--text-primary); 
    }
    .logo-text span { color: var(--primary); }
    .back-btn {
      width: 40px; height: 40px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      text-decoration: none;
    }
    .back-btn svg { width: 20px; height: 20px; }

    /* Page Title */
    .page-title {
      padding: 24px 20px 12px;
    }
    .page-title h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-title h1 .title-icon {
      width: 32px;
      height: 32px;
      filter: brightness(0) saturate(100%) invert(90%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(90%) contrast(90%);
    }
    .page-title h1 .badge {
      font-size: 12px;
      background: var(--primary);
      color: white;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }
    .page-title p {
      color: var(--text-secondary);
      font-size: 15px;
      margin-top: 4px;
    }

    /* Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: var(--radius-full);
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Message Card */
    .msg-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }
    .msg-card:hover {
      border-color: var(--text-muted);
    }
    .msg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .msg-sender {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #6e1a10);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      flex-shrink: 0;
    }
    .msg-sender-info .name {
      font-weight: 600;
      font-size: 15px;
    }
    .msg-sender-info .role {
      font-size: 12px;
      color: var(--text-muted);
    }
    .msg-time {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .msg-body {
      padding-left: 46px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .msg-body p { margin-bottom: 6px; }
    .msg-body p:last-child { margin-bottom: 0; }
    .msg-footer {
      padding-left: 46px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .msg-tag {
      font-size: 11px;
      padding: 2px 12px;
      border-radius: var(--radius-full);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .msg-tag.promotion { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .msg-tag.reply { background: rgba(66, 167, 129, 0.15); color: var(--accent); }
    .msg-tag.system { background: rgba(156, 37, 24, 0.15); color: var(--primary); }
    .msg-tag.important { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .msg-tag.general { background: rgba(136, 136, 136, 0.15); color: var(--text-secondary); }

    .msg-action-btn {
      font-size: 13px;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background 0.2s;
    }
    .msg-action-btn:hover {
      background: rgba(66, 167, 129, 0.1);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .icon {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      display: inline-block;
    }
    .empty-state h3 {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 14px;
    }

    /* Loading */
    .loading-spinner {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-spinner p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c2c2c;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-size: 13px;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      max-width: 90%;
      text-align: center;
    }
    .toast-msg.show {
      opacity: 1;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 30px 20px 20px;
      border-top: 1px solid var(--border);
      margin-top: 30px;
    }
    .footer-copy { font-size: 13px; color: var(--text-muted); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15,15,14,0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 14px;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      transition: color .18s;
      border-radius: var(--radius-sm);
      text-decoration: none;
    }
    .nav-item svg { width: 20px; height: 20px; }
    .nav-item:hover { color: var(--text-primary); }
    .nav-item.active { color: var(--primary); }

    /* Nav icon - custom SMS icon */
    .nav-icon-sms {
      width: 20px;
      height: 20px;
      filter: brightness(0) saturate(100%) invert(90%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(90%) contrast(90%);
    }
    .nav-item.active .nav-icon-sms {
      filter: brightness(0) saturate(100%) invert(30%) sepia(60%) saturate(2000%) hue-rotate(350deg) brightness(60%) contrast(100%);
    }

    @media (max-width: 600px) {
      .page-title h1 { font-size: 24px; }
      .msg-body { padding-left: 0; margin-top: 8px; }
      .msg-footer { padding-left: 0; }
      .msg-header { flex-wrap: wrap; gap: 4px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <a href="index.html" class="logo">
        <span class="logo-text">STORIES <span>ZONE</span></span>
      </a>
    </div>
  </div>
</header>

<!-- Page Title -->
<div class="page-title">
  <h1>
    <img src="/sms_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="Jumbe" class="title-icon" onerror="this.style.display='none'">
    Sanduku la Jumbe
    <span class="badge" id="unreadBadge">0</span>
  </h1>
  <p>Jumbe zote kutoka kwa STORIES ZONE — majibu, matangazo, na taarifa muhimu</p>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs" id="tabContainer">
    <button class="tab-btn active" data-tab="all">Zote</button>
    <button class="tab-btn" data-tab="unread">Zisizosomwa</button>
    <button class="tab-btn" data-tab="replies">Majibu</button>
    <button class="tab-btn" data-tab="promotions">Matangazo</button>
    <button class="tab-btn" data-tab="system">Mfumo</button>
  </div>

  <!-- Tab Content -->
  <div id="tabContent">
    <!-- All Messages -->
    <div class="tab-content active" id="tab-all">
      <div id="messagesContainer">
        <!-- Messages will be rendered here -->
        <div class="loading-spinner" id="loadingSpinner">
          <div class="spinner"></div>
          <p>Inapakia jumbe zako...</p>
        </div>
      </div>
    </div>

    <!-- Unread -->
    <div class="tab-content" id="tab-unread">
      <div id="unreadContainer"></div>
    </div>

    <!-- Replies -->
    <div class="tab-content" id="tab-replies">
      <div id="repliesContainer"></div>
    </div>

    <!-- Promotions -->
    <div class="tab-content" id="tab-promotions">
      <div id="promotionsContainer"></div>
    </div>

    <!-- System -->
    <div class="tab-content" id="tab-system">
      <div id="systemContainer"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toastMsg" class="toast-msg"></div>

<!-- Footer -->
<footer class="footer">
  <p class="footer-copy">© 2026 STORIES ZONE — Sanduku la Jumbe</p>
</footer>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Nyumbani
  </a>
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    Tafuta
  </a>
  <a href="smsbox.html" class="nav-item active">
    <img src="/sms_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="Jumbe" class="nav-icon-sms" onerror="this.style.display='none'">
    Jumbe
  </a>
  <a href="login.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    Akaunti
  </a>
</nav>

<script>
  // ===================== DATA =====================
  // Real messages - no sample/fake data, only real structure
  let messages = [];

  // ===================== DOM REFS =====================
  const containers = {
    all: document.getElementById('messagesContainer'),
    unread: document.getElementById('unreadContainer'),
    replies: document.getElementById('repliesContainer'),
    promotions: document.getElementById('promotionsContainer'),
    system: document.getElementById('systemContainer')
  };

  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');
  const unreadBadge = document.getElementById('unreadBadge');

  // ===================== HELPERS =====================
  function showToast(message) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  // ===================== RENDER FUNCTIONS =====================
  function renderMessageCard(msg) {
    const tagColors = {
      promotion: 'promotion',
      reply: 'reply',
      system: 'system',
      important: 'important',
      general: 'general'
    };
    const tagClass = tagColors[msg.tag] || 'general';

    return `
      <div class="msg-card" data-id="${msg.id}" data-read="${msg.isRead}">
        <div class="msg-header">
          <div class="msg-sender">
            <div class="msg-avatar">${msg.avatar}</div>
            <div class="msg-sender-info">
              <div class="name">${msg.sender}</div>
              <div class="role">${msg.role}</div>
            </div>
          </div>
          <span class="msg-time">${msg.time}</span>
        </div>
        <div class="msg-body">
          <p>${msg.body}</p>
        </div>
        <div class="msg-footer">
          <span class="msg-tag ${tagClass}">${msg.tagLabel}</span>
          ${!msg.isRead ? '<span style="font-size:11px;color:var(--primary);font-weight:600;">● Mpya</span>' : ''}
          <button class="msg-action-btn" onclick="markAsRead(${msg.id})">
            ${msg.isRead ? '✓ Imesomwa' : 'Weka kama imesomwa'}
          </button>
        </div>
      </div>
    `;
  }

  function renderEmptyState(message) {
    return `
      <div class="empty-state">
        <img src="/sms_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="Jumbe" class="icon">
        <h3>Hakuna jumbe</h3>
        <p>${message}</p>
      </div>
    `;
  }

  function filterMessages(type) {
    if (type === 'all') return messages;
    if (type === 'unread') return messages.filter(m => !m.isRead);
    return messages.filter(m => m.type === type);
  }

  function renderContainer(containerId, filterType, emptyMessage) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const filtered = filterMessages(filterType);
    
    if (filtered.length === 0) {
      container.innerHTML = renderEmptyState(emptyMessage || 'Hakuna jumbe za aina hii.');
      return;
    }

    container.innerHTML = filtered.map(m => renderMessageCard(m)).join('');
  }

  function renderAllContainers() {
    renderContainer('messagesContainer', 'all', 'Hakuna jumbe zozote kwa sasa.');
    renderContainer('unreadContainer', 'unread', 'Hakuna jumbe mpya. Vizuri!');
    renderContainer('repliesContainer', 'reply', 'Hakuna majibu bado.');
    renderContainer('promotionsContainer', 'promotion', 'Hakuna matangazo kwa sasa.');
    renderContainer('systemContainer', 'system', 'Hakuna taarifa za mfumo.');
    updateBadge();
  }

  function updateBadge() {
    const unread = messages.filter(m => !m.isRead).length;
    unreadBadge.textContent = unread;
    unreadBadge.style.display = unread > 0 ? 'inline-block' : 'none';
  }

  // ===================== ACTIONS =====================
  window.markAsRead = function(id) {
    const msg = messages.find(m => m.id === id);
    if (msg && !msg.isRead) {
      msg.isRead = true;
      renderAllContainers();
      showToast('✅ Jibu limewekwa kama imesomwa');
    }
  };

  // Mark all as read
  function markAllAsRead() {
    const unread = messages.filter(m => !m.isRead);
    if (unread.length === 0) {
      showToast('Hakuna jumbe mpya.');
      return;
    }
    unread.forEach(m => m.isRead = true);
    renderAllContainers();
    showToast(`✅ Jumbe ${unread.length} zimewekwa kama zimesomwa`);
  }

  // ===================== TAB SWITCHING =====================
  function switchTab(tabId) {
    tabBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabId);
    });

    tabContents.forEach(content => {
      content.classList.toggle('active', content.id === `tab-${tabId}`);
    });
  }

  // ===================== EVENT LISTENERS =====================
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tabId = btn.dataset.tab;
      switchTab(tabId);
    });
  });

  // ===================== FETCH FROM SUPABASE =====================
  async function fetchMessages() {
    try {
      // Import Supabase
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      
      const SUPABASE_URL = 'https://fuyzusikxmkjmnhpdbof.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1eXp1c2lreG1ram1uaHBkYm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjM3MTcsImV4cCI6MjA5NTEzOTcxN30.QaPxUs4e_O64nBxYhByGVkYa4tPIB9OCAh89xuQGG7c';
      
      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      
      // Get current user
      const { data: { user } } = await supabase.auth.getUser();
      
      if (!user) {
        console.log('User not logged in');
        document.getElementById('loadingSpinner').style.display = 'none';
        renderAllContainers();
        return;
      }
      
      // Get user's ID from public.users
      const { data: userData } = await supabase
        .from('users')
        .select('id')
        .eq('auth_user_id', user.id)
        .single();
      
      if (!userData) {
        console.log('User profile not found');
        document.getElementById('loadingSpinner').style.display = 'none';
        renderAllContainers();
        return;
      }
      
      // Fetch messages from messages table
      const { data: messagesData, error } = await supabase
        .from('messages')
        .select('*')
        .eq('user_id', userData.id)
        .order('created_at', { ascending: false });
      
      if (error) {
        console.error('Error fetching messages:', error);
        document.getElementById('loadingSpinner').style.display = 'none';
        renderAllContainers();
        return;
      }
      
      // Transform data to match our format
      if (messagesData && messagesData.length > 0) {
        messages = messagesData.map(msg => ({
          id: msg.id,
          sender: msg.sender || 'STORIES ZONE',
          avatar: getInitials(msg.sender || 'STORIES ZONE'),
          role: msg.role || 'Mfumo',
          time: msg.created_at ? new Date(msg.created_at).toLocaleDateString('sw-TZ', { 
            day: 'numeric', 
            month: 'short', 
            hour: '2-digit', 
            minute: '2-digit' 
          }) : 'Sasa hivi',
          body: msg.message,
          tag: msg.tag || 'general',
          tagLabel: msg.tag_label || 'Taarifa',
          isRead: msg.is_read || false,
          type: msg.type || 'system'
        }));
      }
      
      document.getElementById('loadingSpinner').style.display = 'none';
      renderAllContainers();
      
    } catch (err) {
      console.error('Error:', err);
      document.getElementById('loadingSpinner').style.display = 'none';
      renderAllContainers();
    }
  }

  // ===================== INIT =====================
  // Fetch real messages from Supabase
  fetchMessages();

  // Add "Mark all as read" button to header
  const headerInner = document.querySelector('.header-inner');
  const markAllBtn = document.createElement('button');
  markAllBtn.innerHTML = '✓ Zote';
  markAllBtn.style.cssText = `
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  `;
  markAllBtn.addEventListener('click', markAllAsRead);
  markAllBtn.addEventListener('mouseenter', () => {
    markAllBtn.style.borderColor = 'var(--primary)';
    markAllBtn.style.color = 'var(--text-primary)';
  });
  markAllBtn.addEventListener('mouseleave', () => {
    markAllBtn.style.borderColor = 'var(--border)';
    markAllBtn.style.color = 'var(--text-secondary)';
  });
  headerInner.appendChild(markAllBtn);

  console.log('Sanduku la Jumbe — STORIES ZONE');
</script>

</body>
</html>
